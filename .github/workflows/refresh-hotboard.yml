name: Refresh Hotboard (player_hot fallback)

# 热门球员榜每 30 分钟聚合一次的后台通道（2026-09-30 新增/修正）。
# 背景：player_hot 云函数自带 WeChat 定时触发器（every30m）实测不稳定（16:30 自然触发未响）；
#        改用微信云函数 trigger_hotboard 每 30 分钟做「哑开关」dispatch 本 workflow，
#        复用 trigger_github_action（fetch-fc27 主链路）已验证的稳定模式。
# 关系：trigger_hotboard（微信定时器）是**主调度源**，本 workflow 仅负责执行 buildBoard；
#        GitHub 原生 schedule 在 17:00/17:30 两次未生成 run，已删除，避免空跑/误导。
# 触发：仅 workflow_dispatch（由 trigger_hotboard 每 30 分钟自动 dispatch，也可手动触发）
# 注意：触发与校验逻辑全部内联，不依赖仓库内 scripts/*（避免脚本未入库导致 MODULE_NOT_FOUND）。
on:
  workflow_dispatch:
    inputs:
      ver:
        description: '游戏版本（默认 27 = FC27）'
        type: string
        default: '27'

permissions:
  contents: read

# 同一时间只跑一个，避免两次 buildBoard 互相踩 meta_fc{ver}/hotboard（虽幂等但不必并发）
concurrency:
  group: refresh-hotboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Preflight (云开发凭证体检)
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: node scripts/tcb_whoami.js

      - name: Trigger player_hot#buildBoard via CloudBase
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
          FC_VER: ${{ github.event.inputs.ver || '27' }}
        run: |
          node -e '
          const cloudbase = require("@cloudbase/node-sdk");
          const app = cloudbase.init({ env: process.env.TCB_ENV_ID, secretId: process.env.TCB_SECRET_ID, secretKey: process.env.TCB_SECRET_KEY });
          const ver = process.env.FC_VER || "27";
          (async () => {
            const res = await app.callFunction({ name: "player_hot", data: { action: "buildBoard", version: ver } });
            const r = res && res.result !== undefined ? res.result : res;
            console.log("player_hot 返回:", JSON.stringify(r));
            if (!r || !r.meta || !r.meta.fileID) { console.error("❌ 未拿到 meta.fileID（buildBoard 可能未执行）"); process.exit(1); }
            console.log("✅ buildBoard 成功: count=" + r.count + " fetchedAt=" + r.meta.fetchedAt);
            process.exit(0);
          })().catch(e => { console.error("callFunction 失败:", e && e.message); process.exit(1); });
          '

      - name: Verify hotboard meta updated
        if: always()
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: |
          node -e '
          const cloudbase = require("@cloudbase/node-sdk");
          const app = cloudbase.init({ env: process.env.TCB_ENV_ID, secretId: process.env.TCB_SECRET_ID, secretKey: process.env.TCB_SECRET_KEY });
          (async () => {
            const m = (await app.database().collection("meta_fc27").doc("hotboard").get()).data;
            console.log("meta_fc27/hotboard => fetchedAt=" + m.fetchedAt + " count=" + m.count + " fileID=" + m.fileID);
          })().catch(e => { console.error("读 meta 失败:", e && e.message); process.exit(1); });
          '

  # 方案 B（2026-09-30）：热门榜聚合后顺带生成首页整页静态 JSON（home_hot / home_new）。
  # 由微信定时器 trigger_hotboard 每 30 分钟 dispatch 本 workflow 的节奏继承 —— buildBoard 产出 hotboard
  # 后，这里读 hotboard + players_fc{ver} + dicts 装饰后落云存储，端上零云函数直读首页。
  # continue-on-error：本步失败（如 dicts 暂缺）绝不影响热门榜本身，回退动态路径照常可用。
  gen-payload:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Preflight (云开发凭证体检)
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: node scripts/tcb_whoami.js

      - name: Generate home payload static JSON
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
          FC_VER: ${{ github.event.inputs.ver || '27' }}
        run: node scripts/gen_home_payload.js ${{ github.event.inputs.ver || '27' }}

      - name: Verify home payload static JSON
        if: always()
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
          FC_VER: ${{ github.event.inputs.ver || '27' }}
        run: node scripts/home_payload_test.js ${{ github.event.inputs.ver || '27' }}
