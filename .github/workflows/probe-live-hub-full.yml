name: Probe fut.gg Live Hub (full tracked-set comparison)

# 只读探查：对比 live-hub 聚合 vs definition-data 综合「被追踪」信号，定位逐球员进度来源。
# 与 fetch-fc27.yml / sync-live-hub.yml / probe-live-hub.yml 完全隔离（独立 concurrency 组）。
# 不落库、不改每日同步管线。产物提交回 main（probe/live_hub/full_report.json），便于本地读回。
on:
  workflow_dispatch:
    inputs:
      fc_ver:
        description: 'FC 主版本（默认 27）'
        type: string
        default: '27'

permissions:
  contents: write

concurrency:
  group: probe-live-hub-full
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Probe (real browser bypass Cloudflare)
        env:
          FC_VER: ${{ github.event.inputs.fc_ver || '27' }}
        run: node scripts/probe_live_hub_full2.js ${{ github.event.inputs.fc_ver || '27' }}

      - name: Commit probe result
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe/live_hub/ || true
          git commit -m "probe live-hub-full: tracked-set 对比 + 诊断 $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "no changes"
          for i in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push; then exit 0; fi
            else
              git rebase --abort
            fi
            sleep 5
          done
          echo "::warning::push 重试 3 次后仍失败"
