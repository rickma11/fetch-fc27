name: Probe FutGG Updates

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe (default, may dispatch) | observe (seed baseline only, no dispatch)'
        required: false
        default: 'probe'

permissions:
  contents: write      # commit probe/baseline.json
  actions: write       # dispatch fetch-fc27.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 浏览器过 Cloudflare 需要 Playwright Chromium（与 fetch-fc27 同机制）
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run probe
        env:
          PROBE_MODE: ${{ inputs.mode }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_PROBE }}
        run: node scripts/probe_futgg.js

      - name: Commit baseline if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain probe/baseline.json)" ]]; then
            for i in 1 2 3; do
              git add probe/baseline.json
              git commit -m "chore(probe): update baseline" || true
              git pull --rebase --autostash || true
              if git push; then echo "pushed (attempt $i)"; break; fi
              sleep 5
            done
          else
            echo "baseline unchanged, skip commit"
          fi
