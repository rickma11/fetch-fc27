name: Market Sync Hourly (FC27 prices)

# 独立旁路：把 eafc-miniapp 的 market_sync 云函数逻辑搬到 GitHub 跑。
# 详见 eafc-miniapp/docs/25-market-sync-to-github.md。
#
# 触发：仅 workflow_dispatch（由 cron-job.org 每小时 POST，或手动触发）。
#   - 不挂 Fetch FC27 Daily，对原每日抓取流水线零影响；
#   - 默认 upload=true 真写云存储；只有显式传 inputs.upload=false 时才空跑验证。
#   - cron-job.org 可省略 inputs.upload（默认即上传），也可显式传 "true"/"false"。
#
# 迁移顺序：本 workflow 先建好（闲置）→ 配 cron-job.org 指向它 → 验证稳定后停云函数定时器。
#   在配第三方触发前，云函数 market_sync 必须继续跑（否则市场价格停更）。

on:
  workflow_dispatch:
    inputs:
      upload:
        description: '是否上传到云存储（false=空跑验证，true=真写）'
        type: boolean
        default: true
      retryCount:
        description: '内部自重试计数（勿手动填，由 retry 作业自动递增）'
        type: string
        default: '0'
      simulateFail:
        description: '自检用：true=在拉价前故意失败，用于演练失败自重试链（勿在正式调度里填）'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write   # 自重试需派发新 run（createWorkflowDispatch）

concurrency:
  group: market-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # ⚠️ 2026-10-17：10 → 15。实测近 6 轮稳定 9.3min/轮（拉价批次远多于 under80），
    #   10 分钟上限毫无余量；uploadJsonSafe 慢速失败只重试 1 次后单文件最坏 ~600s，
    #   15 分钟可容纳一次慢速重试（规则 125「留足冗余」同口径）。
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      # ── 自检闸门（simulateFail=true 时故意失败，用于端到端演练 retry 链）──
      # 放在拉价之前，保证演练绝不碰云存储数据（不写 price_view / series）。
      - name: Self-test gate (simulateFail)
        if: ${{ inputs.simulateFail == true }}
        run: |
          echo "::error::simulateFail=1 → 故意失败以验证失败自重试链（本次不写任何云端数据）"
          exit 1

      - name: Sync & upload (upload=${{ github.event.inputs.upload }})
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: node scripts/price_sync_cloud.js ${{ github.event.inputs.upload != 'false' && '--upload' || '' }}

  # ── 失败自重试（方案 B，2026-10-24 加） ──
  # sync 失败时，由本作业通过 API 派发一个新 run（retryCount+1），最多 2 次，
  # 让瞬时链路抖动（如 #514 的 loadRoster 3x30s 超时）在重跑时跨过，避免再丢一小时价格。
  # retryCount 由本作业注入；原始触发方（cron-job.org）无需任何改动，照旧每小时 POST 即可。
  # ⚠️ GitHub Actions 表达式不支持算术 +，故 retryCount+1 在脚本内用 shell $(( )) 计算。
  # ⚠️ inputs.upload / inputs.simulateFail 是「有类型的 boolean」，插值后是 true/false 字符串；
  #    这里统一转成 JSON 布尔再发 dispatch —— 直接透传空串会被 GitHub 判 422（曾踩坑）。
  retry:
    name: Auto-retry on failure
    needs: sync
    if: ${{ failure() && fromJSON(inputs.retryCount || '0') < 2 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 等抖动窗口过去：#514 那次 loadRoster 连挂 3×30s（90s+），等 60s 再重跑更可能跨过
      - name: Wait out transient blip
        run: sleep 60

      - name: Re-dispatch run (retry ${{ inputs.retryCount }}+1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUR=${{ inputs.retryCount || '0' }}
          NEXT=$((CUR + 1))
          UP='${{ inputs.upload }}'
          [ "$UP" = "false" ] && UPJ=false || UPJ=true
          SF='${{ inputs.simulateFail }}'
          [ "$SF" = "true" ] && SFJ=true || SFJ=false
          echo "派发自重试 run：retryCount=${NEXT} upload=${UPJ} simulateFail=${SFJ}"
          CODE=$(curl -s -o /tmp/dispatch.out -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"upload\":${UPJ},\"retryCount\":\"${NEXT}\",\"simulateFail\":${SFJ}}}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/market-sync.yml/dispatches")
          echo "dispatch HTTP=${CODE}"
          cat /tmp/dispatch.out || true
          # 派发失败必须让本作业失败，否则等于静默放弃重试（规则 125：不得静默失败）
          if [ "$CODE" != "204" ]; then
            echo "::error::派发自重试 run 失败，HTTP=${CODE}"
            exit 1
          fi
