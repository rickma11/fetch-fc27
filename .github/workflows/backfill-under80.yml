name: Backfill 24h Series Under80 (FC27)

# 一次性/应急：用历史 under80_view_<bucket>.json（slim 快照）重放 buildSeries 重建 80↓ 序列。
# 典型场景：主序列被重置/损坏、backup 也救不了（或坏了没人发现、backup 已被污染）时，复活近 24h 历史。
# 触发：仅 workflow_dispatch（手动，或 cron-job.org 一次性 POST）。默认 upload=true 真写云存储。
# 用法：node scripts/price_sync_cloud.js --backfill-under80 --upload
# 注意：快照自 2026-10-17 14:00 起才有，之前的小时会 included=0 跳过（正常）。
# ⚠️ 2026-10-23 起主序列不在云上（Actions cache 传递）：回填产物写本地状态文件 + 云 backup_latest。
#   本 workflow 配了同款 u80-series cache 步骤 ⇒ 回填结果直接入 cache，下一轮 hourly 读旧即恢复，
#   无需再手动清 cache。timeout 10min：备份上传 4.1MB 最坏 ~600s（慢速重试有界）。

on:
  workflow_dispatch:
    inputs:
      upload:
        description: '是否上传到云存储（false=空跑验证，true=真写）'
        type: boolean
        default: true

permissions:
  contents: read

# 与 under80 整点同步同一并发组，避免回填与 hourly 同时写文件互相覆盖（与 80+ 同设计）。
concurrency:
  group: market-sync-under80
  cancel-in-progress: false

jobs:
  backfill-under80:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      # 与 market-sync-under80.yml 同 key 前缀：回填写入的本地状态文件随本 job 结束入 cache，
      # 下一轮 hourly 的「Cache under80 series state」步骤即还原到它（恢复链最后一环）。
      - name: Cache under80 series state
        uses: actions/cache@v4
        with:
          path: scripts/.u80state/series_24h_under80.json
          key: u80-series-${{ github.run_id }}
          restore-keys: |
            u80-series-

      - name: Backfill under80 & upload (upload=${{ github.event.inputs.upload }})
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: node scripts/price_sync_cloud.js --backfill-under80 ${{ github.event.inputs.upload != 'false' && '--upload' || '' }}
