name: Storage Housekeeping

# 云存储历史文件清理（独立于每日抓取链路）。
# 见 scripts/housekeeping.js：清理 fc27/data/ 下 6 类按 hash/时间戳堆积的静态 JSON 死数据
# （尤其 hotboard 每 30 分钟一个、从不清理）。GitHub 原生 schedule 定时跑，不依赖云函数触发器。
#
# 时区：GitHub cron 为 UTC。'30 19 * * *' = 北京时间 03:30 每日。
# 手动触发（workflow_dispatch）可指定 dry-run（只列不删）先做验证。
on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '执行模式：clean=实际删除历史文件；dry-run=只列出不删除（验证用）'
        type: choice
        default: clean
        options: [clean, dry-run]

permissions:
  contents: read

# 同一时间只跑一个，避免与自身并发
concurrency:
  group: housekeeping
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
      TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
      TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'   # 本流程不需要浏览器，跳过下载省时
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run housekeeping
        run: node scripts/housekeeping.js 27 ${{ github.event.inputs.mode == 'dry-run' && '--dry-run' || '' }}
