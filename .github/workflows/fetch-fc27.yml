name: Fetch FC27 Daily

on:
  # 定时由 eafc-miniapp 云函数 trigger_github_action 卡点（每日 01:20 / 02:20 各 dispatch 一次），
  # 不再使用 GitHub 原生 schedule（实测常延迟数小时，且会与云触发在 02:20 重复触发）。
  workflow_dispatch:
    inputs:
      mode:
        description: '抓取模式：auto=北京时间周日全量、其余增量；data-only=仅拉球员数据跳过头像；images-only=仅下载球员图片（不抓数据）；no-portrait-only=仅基于云存储已有卡面重做无头像卡面'
        type: choice
        default: auto
        options: [auto, incremental, full, data-only, images-only, no-portrait-only]
      img_max:
        description: '本次最多下载多少张图片，0=不限（首次全量背图填 0）'
        type: string
        default: '1500'

permissions:
  contents: write

# 同一时间只跑一个，避免两次抓取互相踩到快照
concurrency:
  group: fetch-fc27
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 日常 15 分钟左右；首次全量背图（2 万张，跨境上传）最慢，留足余量。
    # 实测：每周日 auto=full 整轮（抓取 42min + 落库 18min + 背图 ~2h）≈ 179 分钟，
    # 距旧上限 180min 仅差 1 分钟 —— 稍慢就会被强杀（连提交版本历史都跑不到），故提到 300。
    # 图片清单是边传边记的，即使被超时杀掉，下次也只补没传完的部分。
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Resolve mode
        id: mode
        run: |
          IN='${{ github.event.inputs.mode }}'
          if [ -z "$IN" ] || [ "$IN" = "auto" ]; then
            # 用北京时间判断星期：周日(7)跑全量兜底，其余走增量
            BJ_DOW=$(TZ=Asia/Shanghai date +%u)
            if [ "$BJ_DOW" = "7" ]; then MODE=full; else MODE=incremental; fi
          else
            MODE="$IN"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "本次模式: $MODE（北京时间 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M %A')）"

          # 数据落库开关：只有「只做图 / 只做无像卡」两种模式跳过落库。
          # ⚠️ data-only **绝不能**跳：它的全部意义就是重塑数据并落库（新字段靠它回填）。
          #    2026-09-17 踩坑：曾把 data-only 也列进来 → run#34 抓完 21242 人却不落库，白跑 53min。
          case "$IN" in
            images-only|no-portrait-only) SKIP_DB=true ;;
            *) SKIP_DB=false ;;
          esac
          echo "skip_db=$SKIP_DB" >> "$GITHUB_OUTPUT"

          # 整体跳过抓取步骤：no-portrait-only 不需要列表/详情/图片，
          # 直接基于云存储里已有的 {eaId}_card.webp 生成无像卡面。
          if [ "$IN" = "no-portrait-only" ]; then SKIP_FETCH=true; else SKIP_FETCH=false; fi
          echo "skip_fetch=$SKIP_FETCH" >> "$GITHUB_OUTPUT"

          # 图片模式：images-only 让 fetch_ci 只抓列表+下图片就退出（FC_IMG_ONLY=1），不抓详情。
          if [ "$IN" = "images-only" ]; then FC_IMG_ONLY=1; else FC_IMG_ONLY=; fi
          echo "fc_img_only=$FC_IMG_ONLY" >> "$GITHUB_OUTPUT"

          # 是否跑无像卡生成：data-only 跳过（图整段都跳）；其余都跑。
          if [ "$IN" = "data-only" ]; then RUN_NP=false; else RUN_NP=true; fi
          echo "run_np=$RUN_NP" >> "$GITHUB_OUTPUT"

          # 图片单次上限：images-only 默认 0（不限，专门补图，run 可配更长 timeout）；其余用输入或默认 1500。
          if [ "$IN" = "images-only" ]; then
            IMG=0
          else
            IMG='${{ github.event.inputs.img_max }}'
            if [ -z "$IMG" ]; then IMG=1500; fi
          fi
          echo "img_max=$IMG" >> "$GITHUB_OUTPUT"
          echo "图片单次上限: $IMG（0=不限）"

          # 跳过头像下载+上传：data-only 与 no-portrait-only 都不下新图（后者基于已有 card.webp）。
          # 仍跑无像卡生成的看 RUN_NP；Upload player images 看 skip_images。
          if [ "$IN" = "data-only" ]; then
            echo "skip_images=true" >> "$GITHUB_OUTPUT"
            echo "db_mode=full" >> "$GITHUB_OUTPUT"
            echo "[data-only] 跳过头像步骤（FC_IMG=0），云库落库=full"
          elif [ "$IN" = "no-portrait-only" ]; then
            echo "skip_images=true" >> "$GITHUB_OUTPUT"
            echo "db_mode=$MODE" >> "$GITHUB_OUTPUT"
            echo "[no-portrait-only] 跳过抓取与图片上传，仅基于云存储已有 card.webp 生成无像卡面"
          else
            echo "skip_images=false" >> "$GITHUB_OUTPUT"
            echo "db_mode=$MODE" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'   # 浏览器内核交给下一步单独装，避免此处重复下载
        run: npm install

      - name: Unit tests (签名与差异归类)
        run: npm test

      # 前置检查：先确认这套凭证能不能看到目标环境、有没有数据库操作权限。
      # 放在抓取之前 —— 凭证有问题时几秒就失败，不用白等 6 分钟抓取再报错。
      - name: Preflight (云开发凭证体检)
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: node scripts/tcb_whoami.js

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Fetch FC27 via real browser (bypass Cloudflare)
        # no-portrait-only 跳过整个抓取（直接基于云存储已有卡面建无像卡）
        if: ${{ steps.mode.outputs.skip_fetch != 'true' }}
        env:
          FC_MODE: ${{ steps.mode.outputs.db_mode }}
          # data-only 时 FC_IMG=0：fetch_ci.js 跳过阶段 4 图片下载（数据 dump 不受影响）
          # images-only 时 FC_IMG_ONLY=1：fetch_ci.js 抓列表后只下图片并退出，不抓详情/不落库
          FC_IMG: ${{ steps.mode.outputs.skip_images == 'true' && '0' || '1' }}
          FC_IMG_ONLY: ${{ steps.mode.outputs.fc_img_only }}
          # 只下载/上传两种图：portrait(半身像) + card(FUT 卡面)。
          # simple(简约卡) 小程序端没有任何页面展示，是死数据，故跳过以省 1/3 流量与云存储。
          FC_IMG_TYPES: 'portrait,card'
          FC_IMG_CONC: '10'
          FC_IMG_MAX: ${{ steps.mode.outputs.img_max }}
        run: node scripts/fetch_ci.js

      - name: Shape data (offline)
        if: ${{ steps.mode.outputs.skip_db != 'true' }}
        run: node scripts/fetch_futgg.js --from-dump fc27_dump.json --ver 27 --no-local

      # SBC / Evolutions 抓取（与球员管线同一套真实浏览器过 CF 机制，独立步骤、独立浏览器）
      # 输出 cloud-data/fc27/sbcs.json + evolutions.json + sbc_evo_summary.json
      - name: Scrape SBC & Evolutions (real browser bypass Cloudflare)
        if: ${{ steps.mode.outputs.skip_db != 'true' }}
        continue-on-error: true
        run: node scripts/scrape_sbc_evolutions.js --ver 27

      # Player Pick 类 SBC 选择球员富集（2026-09-20 补）：scrape 只写出 set.pool.id/slug，
      # 不含选择球员。本步骤遍历带 pool 的 set，用同一套真实浏览器过 CF 抓 pool 页选择球员，
      # 回填 choicePlayers 进 sbcs.json。失败不致命（continue-on-error），不影响 SBC 列表上云。
      # 独立步骤：与 scrape 解耦，可单独重跑，不碰已稳定的生产管线。
      - name: Enrich SBC Player Pick choices (real browser bypass Cloudflare)
        if: ${{ steps.mode.outputs.skip_db != 'true' }}
        continue-on-error: true
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: node scripts/enrich_sbc_pools.js --ver 27

      - name: Upload to CloudBase Database
        if: ${{ steps.mode.outputs.skip_db != 'true' }}
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
          FC_MODE: ${{ steps.mode.outputs.db_mode }}
        run: node scripts/upload_db.js --ver 27

      # 收藏室代币兑换价（2026-09-21 补）：fut.gg 球员详情接口不含该数值，权威来源是
      # r2 静态数据集 token-store（manifest 引 hash，商店轮换 hash 会变）。本步骤抓数据集
      # （真实浏览器过 CF）→ 把 itemType=player 条目的 tokenCost 按 player.eaId 局部 update
      # 回写 players_fc{ver}+details_fc{ver} 的 tokenStoreCost。
      # 顺序约束：必须在 Upload to CloudBase 之后（doc.set 抹平非 pickPlayer 字段，本步重补＝自愈）、
      # Warm up roster 之前（当天 roster payload 就带上该字段，详情页首屏直显）。
      - name: Sync Token Store costs to CloudBase
        if: ${{ steps.mode.outputs.skip_db != 'true' }}
        continue-on-error: true
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
          CF_HEADLESS: 'true'
        run: node scripts/sync_token_store.js --ver 27

      # SBC 上云（2026-09-19 补）：scrape 写出的 sbcs.json 此前没有任何步骤往云库传，
      # 小程序 SBC 页读的是 sbcs_fc27 → 一直停在最后一次手动上传的旧数据。
      - name: Upload SBC to CloudBase Database
        if: ${{ steps.mode.outputs.skip_db != 'true' }}
        continue-on-error: true
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: node scripts/upload_sbcs.js --ver 27

      # SBC set 封面转存云存储（2026-09-19 补）：小程序端 sbcs.js#imgUrl 按确定性命名
      # sbc_<id>.webp 直拼 cloud fileID，本步骤把当日新增 set 封面下载（真实浏览器过 CF）
      # 并上传到 fc27/images/ —— 没有这步，当天新 SBC 的封面在真机上全部缺图（CDN 真机取不到）。
      - name: Sync SBC Covers to Cloud Storage
        if: ${{ steps.mode.outputs.skip_db != 'true' }}
        continue-on-error: true
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: node scripts/sync_sbc_covers.js --ver 27

      # 译名自动对账（2026-09-16）：EA 每次数据更新都可能冒出新的联赛/俱乐部/国家。
      # 本步骤扫刚落库的全量数据，把「包内词典没收录」的取值补齐：
      #   · 国家       → fetch-fc27/data/country-zh.json 全量对照表
      #   · 联赛       → "<国家/地区> League|Liga|…" 规则推导
      #   · 俱乐部     → 不机器翻译（EA 化名硬翻必错），留在 cloud-data/fc27/i18n_pending.json 等人工补
      # 结果写云库 dicts/names，端上启动拉取后立即生效 —— **新联赛/新国家不用重新发版**。
      # 必须放在落库之后（要扫当天最新数据）。
      - name: Sync i18n names to cloud (auto-translate new leagues/clubs/nations)
        if: ${{ steps.mode.outputs.skip_db != 'true' }}
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: node scripts/sync_i18n.js --ver 27

      # roster 预热（2026-09-19 补）：get_players 云函数对 >1000 条拒绝现场生成（3s 超时保护），
      # meta_fc27/roster 一旦缺失，小程序 preloadRoster 永远拿 code=1 → 本地无 roster 缓存，
      # 列表页「数据更新于」与本地快速筛选全部失效。本步骤在每日落库后重建 roster payload
      # （上传云存储 + 写 meta 文档，投影与 get_players schema 9 一致），ts = 当日数据时间。
      # 必须放在 upload_db 之后（要用当天最新数据构建）。
      - name: Warm up roster payload (rebuild after daily upload)
        if: ${{ steps.mode.outputs.skip_db != 'true' }}
        continue-on-error: true
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: node scripts/warm_roster.js

      # 阵型战术「化学数据链」（2026-09-21 补）：把 players_fc{ver} 的 club/league/nation **eaId**
      # 抽成一个列式小文件（~300KB）传云存储 squad/chem_v1_{ver}.json + 写 meta_fc{ver}/squad_chem，
      # 供小程序「阵型战术」页按 eaId 查表算化学（roster 投影里只有 club.name 这类名字、没有 eaId）。
      # 独立步骤 + continue-on-error ⇒ 它挂了 roster 照旧（与 enrich_sbc_pools 同一设计思路）。
      # 顺序约束：必须在 Warm up roster **之后** —— 两份文件取自同一份 DB 快照，永不错位。
      # 只读云库，不与 upload_db 抢。⚠️ 端上要能取到还需部署 cloudfunctions/squad_meta（整目录上传）。
      - name: Gen squad chem (eaIds for squad/tactics module)
        if: ${{ steps.mode.outputs.skip_db != 'true' }}
        continue-on-error: true
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: node scripts/gen_squad_chem.js

      # 图片上传放在落库之后：图片失败不该拖累每天的数据同步。
      # 允许失败（continue-on-error）——脚本会把「已成功」的部分写进 images.json，
      # 下次运行按清单续传，不会重复也不会漏。
      - name: Upload player images to Cloud Storage
        if: ${{ steps.mode.outputs.skip_images != 'true' }}
        continue-on-error: true
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: node scripts/upload_images.js --ver 27

      # 稀有度小卡面（筛选弹层用）：fetch_ci 阶段 4b 已按清单增量下载到 images_out/rarity_{id}.webp，
      # 这里原样上传云存储 fc{ver}/images/。数量只有几~几十张、秒级完成；任何一张失败下次自动补。
      - name: Upload rarity card faces to Cloud Storage
        continue-on-error: true
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: node scripts/upload_rarity_images.js --ver 27

      # 无半身像卡面：fut.gg 没有半身像的球员（约 320 名）卡面照片区是空的，且 fut.gg 还多画了
      # 两处残留（左上角破图占位图标 + OVR 右侧一行多余姓名）。这里用「同稀有度无像卡逐像素中位数」
      # 建一张干净底板抹掉残留，再叠一枚通用灰色半身剪影，输出 {eaId}_np.webp 给小程序展示。
      # 数据源就是上一步刚上传的 {eaId}_card.webp，不访问 fut.gg，因此本机也能手动补跑。
      # 放在图片上传之后：当天新出现的无像球员当天就有图。签名未变的一律跳过。
      # ⚠️ 必须带 `--all`：目标集合改从**云库**取（imagePath 为空的球员），而不是仓库里那份
      #    只在 full 模式才更新的 players.json（历史上是 10000 条截断快照）—— 否则新出现的
      #    无像球员不在那份文件里，永远拿不到 _np.webp，端上会显示空白。
      - name: Build no-portrait cards to Cloud Storage
        if: ${{ steps.mode.outputs.run_np == 'true' }}
        continue-on-error: true
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: node scripts/gen_noportrait_cards.js --ver 27 --all

      # 注意：必须放在落库成功之后。快照只有在数据确实写进数据库后才能推进，
      # 否则一旦落库失败，下次增量会误判「无变化」而永久漏数据。
      - name: Commit version history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cloud-data/fc27/snapshot.json cloud-data/fc27/changes.json cloud-data/fc27/facets.json || true
          # 译名对账：增长层词典（自动补的译名）+ 待人工处理的清单
          git add data/i18n-names.json cloud-data/fc27/i18n_pending.json || true
          # 图片清单：记录每个球员的图已上传到哪个内容签名，驱动图片增量
          git add cloud-data/fc27/images.json || true
          # 全息官方面清单（eaId → 官方卡面路径）。⚠️ 必须提交：全息路径只在详情接口里，
          # 而增量模式只抓变化球员的详情 → 不落盘的话未变球员算出的签名会比全量少一段，
          # 与 images.json 不符 → 每天重下这些人的图，且签名在 full/incremental 间来回翻。
          git add cloud-data/fc27/holo.json || true
          # 稀有度小卡面清单（此前漏提交 → 每 run 从零开始，等于每天重下全部稀有度小卡面）
          git add cloud-data/fc27/rarity_images.json || true
          # 无半身像卡面清单（内容签名，未变则下次跳过重新生成）
          git add cloud-data/fc27/noportrait.json || true
          # SBC / Evolutions 抓取结果（每日更新，小文件，每次都提交）
          git add cloud-data/fc27/sbcs.json cloud-data/fc27/evolutions.json cloud-data/fc27/sbc_evo_summary.json || true
          # SBC set 封面映射清单（sync_sbc_covers 产出，小文件）
          git add cloud-data/fc27/sbc_faces.json || true
          # SBC set 封面内容指纹清单（未变则跳过重复上传）。⚠️ 必须提交：runner 工作区每轮从零开始，
          # 不落盘 → 指纹恒为空 → 每天把十几张封面重复 PUT 一遍（方案 A，2026-09-22）。
          git add cloud-data/fc27/sbc_covers_sig.json || true
          # 收藏室代币价映射清单（sync_token_store 产出，小文件）
          git add cloud-data/fc27/token_store.json || true
          # ⚠️ 不再提交 players.json / details.json：全量数据单文件常超 GitHub 100MB 硬限，
          # pre-receive 会确定性拒绝且整次 push（含小清单）一起失败。全量真源是云库，无需在 git 留版本快照。
          git commit -m "chore: FC27 ${{ steps.mode.outputs.mode }} sync $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')" || echo "no changes"
          # ⚠️ 工作区几乎必然残留「未跟踪/未暂存」文件（fc27_dump.json、players.json、
          #    details.json 等中间产物，故意不提交）。而 git rebase 要求工作区干净，
          #    否则直接报 "cannot rebase: You have unstaged changes" 并以 exit 128 失败
          #    —— 这会让整步判 failure，清单（images.json 等）一个都提交不上去。
          #    故先整包 stash（含未跟踪），push 完成后再尝试 pop 回来。
          STASHED=0
          if [ -n "$(git status --porcelain)" ]; then
            git stash push -u -m "wip-before-rebase" && STASHED=1 || echo "stash 失败，继续尝试"
          fi
          # 远端 main 可能已被 probe-futgg workflow 的结果回写推进（两者并发组不同、互不排斥），
          # 也可能是「re-run failed jobs」复用了旧 checkout sha —— 盲推会 non-fast-forward 被拒。
          # 先变基到最新 main 再推（probe 只动 probe/，与 cloud-data/ 无冲突），带 3 次重试。
          PUSHED=0
          for i in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push; then PUSHED=1; break; fi
            else
              git rebase --abort
            fi
            echo "push 第 $i 次被拒，5 秒后重试..."
            sleep 5
          done
          if [ "$STASHED" = "1" ]; then git stash pop || echo "stash pop 失败（推送已完成，残留可忽略）"; fi
          if [ "$PUSHED" = "1" ]; then echo "push 成功"; exit 0; fi
          echo "::error::push 重试 3 次后仍失败"
          exit 1

      - name: Show run summary
        if: always()
        run: |
          cat cloud-data/fc27/changes.json || true
          node -e "
            const f='cloud-data/fc27/images.json';
            try { const j=JSON.parse(require('fs').readFileSync(f,'utf8'));
              console.log('\n图片清单: 已上传 '+Object.keys(j).length+' 名球员的卡图'); }
            catch(e){ console.log('\n图片清单: 尚未生成'); }
          "
