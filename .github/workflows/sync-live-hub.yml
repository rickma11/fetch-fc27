name: Sync fut.gg Live Hub (FC27 tracked players)

# 升级追踪同步（独立于 fetch-fc27 管线）：
#   抓 fut.gg Live Hub 全量 JSON → 用 card.eaId 建索引组装精简进度 → 上传云存储 fc27/livehub/
#   + 写 meta_fc27/livehub 元文档（端上只读静态 JSON，不调云函数，降低云调用）。
# ⚠️ 与 fetch-fc27.yml / probe-live-hub.yml 完全隔离：独立 concurrency 组（sync-live-hub），
#   不碰 cloud-data/fc27、不落库 players、不改每日同步管线、不提交 git（产物只在云存储）。
#
# 触发：
#   - 原生 schedule：每日 02:30 北京时间（UTC 18:30）一次，作为可靠兜底（GitHub 原生调度）。
#   - workflow_dispatch：手动触发（fc_ver 默认 27）。
#   - 如已在 eafc-miniapp 的 trigger_github_action/config.json 计时器里登记本 workflow，
#     外置计时器也会 dispatch；与上面 schedule 不重叠（计时器只 dispatch 登记过的 workflow）。
on:
  workflow_dispatch:
    inputs:
      fc_ver:
        description: 'FC 主版本（默认 27；只抓该版本，目前仅 FC27）'
        type: string
        default: '27'
  schedule:
    - cron: '30 18 * * *'   # UTC 18:30 ≈ 北京时间次日 02:30

permissions:
  contents: read

concurrency:
  group: sync-live-hub
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'   # 浏览器内核交给下一步单独装
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Sync Live Hub (real browser bypass Cloudflare → upload to CloudBase)
        env:
          FC_VER: ${{ github.event.inputs.fc_ver || '27' }}
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: node scripts/sync_live_hub.js ${{ github.event.inputs.fc_ver || '27' }}
